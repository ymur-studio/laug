; The stack's Grafana 11.1.0 (_obs/README.md): five boards on 127.0.0.1:7740, anonymous Viewer, boards
; provisioned read-only, every outbound feature off, no alerting. bin/obs up copies this file into OBS_DIR/conf and
; writes OBS_DIR where it reads @OBS_DIR@. Keys as conf/defaults.ini of the 11.1.0 tarball names them (read
; 2026-10-17 on the dev host); what each does is from the 11.1.0 tarball's docs, api_url's from [grafana_com] below.

[paths]
data = @OBS_DIR@/grafana
logs = @OBS_DIR@/log
plugins = @OBS_DIR@/grafana/plugins
provisioning = @OBS_DIR@/conf/grafana/provisioning

[server]
protocol = http
; An empty http_addr "will bind to all interfaces" (conf/defaults.ini), so it is set, and make obs-test
; refuses this file without it.
http_addr = 127.0.0.1
http_port = 7740
domain = 127.0.0.1
root_url = http://127.0.0.1:7740/
enforce_domain = false

[security]
admin_user = admin
; Made at the first obs-up, mode 600, in OBS_DIR; never in the checkout.
admin_password = $__file{@OBS_DIR@/grafana/admin-password}
disable_gravatar = true
angular_support_enabled = false

[auth.anonymous]
; The cells' Grafana runs anonymous Admin (cells/compose/cell.yml). This one keeps weeks of runs, so a viewer reads
; and cannot change or delete a board.
enabled = true
org_name = Main Org.
org_role = Viewer

[users]
allow_sign_up = false
allow_org_create = false
default_theme = dark

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[news]
news_feed_enabled = false

[snapshots]
external_enabled = false

[public_dashboards]
enabled = false

[grafana_com]
; Grafana's own address in place of grafana.com. With every outbound key above off, 11.1.0 still fetched
; https://grafana.com/api/plugins/angular_patterns at its start: one HTTPS connection, in 10 of 31 samples 10 s apart,
; about 90 s. It has no key of its own. Its debug log gives the job's interval as 24h0m0s, and one start put the next
; fetch 29 h 59 min out; no run here lasted long enough to see a second (seen 2026-10-17 on the dev host: ss -tnp, and
; its debug log). With these two lines it asks itself, gets a 404 and logs one error a fetch, "Error while updating
; detectors", and every socket stays on 127.0.0.1.
url = http://127.0.0.1:7740
api_url = http://127.0.0.1:7740/api

[plugins]
plugin_admin_enabled = false
public_key_retrieval_disabled = true

[unified_alerting]
; The stack never judges, so no rule engine runs.
enabled = false

[date_formats]
default_timezone = UTC

[log]
; One stream, to the start line's log/grafana.log.
mode = console
level = warn
