<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470" role="img"
    aria-labelledby="incumbent-arm-title incumbent-arm-desc" font-family="Inter, system-ui, sans-serif">
<title id="incumbent-arm-title">The incumbent arm: the release judged against the one it replaces, in one wave</title>
<desc id="incumbent-arm-desc">One gate&#39;s wave. Three items run at once on one host, each on a cell leased from laug
    pool serve: incumbent, leased first, runs the plan&#39;s incumbent release; steady runs the release under test with
    the same load; persistence-latency, the plan&#39;s item pl, runs the release under that fault. R4 holds when each
    item&#39;s result is its expect. R7 compares steady with incumbent: d is the release&#39;s reading less the
    incumbent&#39;s, for each compared reading, and only worse BLOCKs, when d is over that reading&#39;s tolerance
    (gate/plan.yaml, load/steady-state.yaml). Sources: docs/img/src/incumbent-arm.txt, gate/plan.yaml,
    internal/judge/rules.go, load/steady-state.yaml.</desc>
<rect x="0" y="0" width="800" height="470" fill="#EEF3F2"/>
<text x="24" y="30" font-size="14" fill="#163A44"
    font-weight="600">The incumbent arm: the release judged against the one it replaces, in one wave</text>
<text x="24" y="50" font-size="12"
    fill="#163A44">gate/plan.yaml&#39;s wave on one host: three items at once, each on a cell of its own from laug pool serve</text>
<g aria-label="laug pool serve, 127.0.0.1:7700">
  <rect x="24" y="72" width="260" height="44" fill="#CFE3E4" stroke="#163A44"/>
  <text x="154" y="90.5" font-size="12" fill="#163A44" text-anchor="middle" font-weight="600">laug pool serve</text>
  <text x="154" y="105.5" font-size="12" fill="#163A44" text-anchor="middle"
      font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace">127.0.0.1:7700</text>
</g>
<text x="300" y="92" font-size="11" fill="#163A44">leases three cells, incumbent&#39;s first</text>
<rect x="16" y="128" width="768" height="132" fill="none" stroke="#163A44" stroke-dasharray="6 4"/>
<text x="24" y="144" font-size="11" fill="#163A44" font-weight="600">one wave on one host</text>
<g aria-label="incumbent, server 1.31.0, the plan&#39;s, incumbent; a load, 5 m, at 20/s, 50 at once">
  <rect x="24" y="156" width="236" height="92" fill="#CFE3E4" stroke="#163A44"/>
  <text x="142" y="183.5" font-size="12" fill="#163A44" text-anchor="middle" font-weight="600">incumbent</text>
  <text x="142" y="198.5" font-size="12" fill="#163A44" text-anchor="middle">server 1.31.0, the plan&#39;s</text>
  <text x="142" y="213.5" font-size="12" fill="#163A44" text-anchor="middle">incumbent; a load, 5 m</text>
  <text x="142" y="228.5" font-size="12" fill="#163A44" text-anchor="middle">at 20/s, 50 at once</text>
</g>
<g aria-label="steady, the release under test,, SERVER_TAG; the same load">
  <rect x="282" y="156" width="236" height="92" fill="#CFE3E4" stroke="#163A44"/>
  <text x="400" y="191" font-size="12" fill="#163A44" text-anchor="middle" font-weight="600">steady</text>
  <text x="400" y="206" font-size="12" fill="#163A44" text-anchor="middle">the release under test,</text>
  <text x="400" y="221" font-size="12" fill="#163A44" text-anchor="middle">SERVER_TAG; the same load</text>
</g>
<g aria-label="persistence-latency, the release under test,, under that fault,, the plan&#39;s item pl">
  <rect x="540" y="156" width="236" height="92" fill="#CFE3E4" stroke="#163A44"/>
  <text x="658" y="183.5" font-size="12" fill="#163A44" text-anchor="middle"
      font-weight="600">persistence-latency</text>
  <text x="658" y="198.5" font-size="12" fill="#163A44" text-anchor="middle">the release under test,</text>
  <text x="658" y="213.5" font-size="12" fill="#163A44" text-anchor="middle">under that fault,</text>
  <text x="658" y="228.5" font-size="12" fill="#163A44" text-anchor="middle">the plan&#39;s item pl</text>
</g>
<g aria-label="R4, outcome, each item&#39;s result is, its expect: ADVANCE, here,, for all three">
  <rect x="24" y="300" width="236" height="80" fill="#CFE3E4" stroke="#163A44"/>
  <text x="142" y="321.5" font-size="12" fill="#163A44" text-anchor="middle" font-weight="600">R4, outcome</text>
  <text x="142" y="336.5" font-size="12" fill="#163A44" text-anchor="middle">each item&#39;s result is</text>
  <text x="142" y="351.5" font-size="12" fill="#163A44" text-anchor="middle">its expect: ADVANCE, here,</text>
  <text x="142" y="366.5" font-size="12" fill="#163A44" text-anchor="middle">for all three</text>
</g>
<g aria-label="R7, incumbent, d: steady&#39;s reading less, incumbent&#39;s; WORSE when d, is over its tolerance">
  <rect x="282" y="300" width="236" height="80" fill="#163A44" stroke="#163A44"/>
  <text x="400" y="321.5" font-size="12" fill="#EEF3F2" text-anchor="middle" font-weight="600">R7, incumbent</text>
  <text x="400" y="336.5" font-size="12" fill="#EEF3F2" text-anchor="middle">d: steady&#39;s reading less</text>
  <text x="400" y="351.5" font-size="12" fill="#EEF3F2" text-anchor="middle">incumbent&#39;s; WORSE when d</text>
  <text x="400" y="366.5" font-size="12" fill="#EEF3F2" text-anchor="middle">is over its tolerance</text>
</g>
<line x1="228" y1="248" x2="318.163" y2="296.227" fill="none" stroke="#163A44" stroke-width="1.5"/>
<polygon points="325.217,300 316.277,299.754 320.05,292.7" fill="#163A44"/>
<line x1="400" y1="248" x2="400" y2="292" fill="none" stroke="#163A44" stroke-width="1.5"/>
<polygon points="400,300 396,292 404,292" fill="#163A44"/>
<g aria-label="R7&#39;s tolerances">
  <text x="544" y="306" font-size="11" fill="#163A44" font-weight="600">R7&#39;s tolerances, ms or a share</text>
  <text x="544" y="324" font-size="11" fill="#163A44">workflow task s2s p99</text>
  <text x="772" y="324" font-size="11" fill="#163A44" text-anchor="end"
      font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace">1.02 ms</text>
  <text x="544" y="339" font-size="11" fill="#163A44">persistence p99</text>
  <text x="772" y="339" font-size="11" fill="#163A44" text-anchor="end"
      font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace">0.35 ms</text>
  <text x="544" y="354" font-size="11" fill="#163A44">activity s2s past 10 ms</text>
  <text x="772" y="354" font-size="11" fill="#163A44" text-anchor="end"
      font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace">0.0072</text>
  <text x="544" y="369" font-size="11" fill="#163A44">frontend past 10 ms</text>
  <text x="772" y="369" font-size="11" fill="#163A44" text-anchor="end"
      font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace">0.0032</text>
  <text x="544" y="384" font-size="11" fill="#163A44">end-to-end past 50 ms</text>
  <text x="772" y="384" font-size="11" fill="#163A44" text-anchor="end"
      font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace">0.0064</text>
</g>
<text x="24" y="424" font-size="11"
    fill="#163A44">Only worse BLOCKs: a d under its tolerance, or below zero, passes. In an A/A gate both arms run one release.</text>
<text x="24" y="442" font-size="11" fill="#163A44">incumbent and steady share the host, the hour and the load.</text>
</svg>
