<text x="24" y="330" font-size="11" fill="#163A44">Commands are proposals: the worker never writes an event.</text>
<text x="24" y="345" font-size="11" fill="#163A44">Steps 1 to 4 repeat once per workflow task.</text>
<text x="24" y="404" font-size="12" fill="#163A44"
