<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" role="img"
    aria-labelledby="healthcheck-path-title healthcheck-path-desc" font-family="Inter, system-ui, sans-serif">
<title id="healthcheck-path-title">The worker proposes; history writes every event</title>
<desc id="healthcheck-path-desc">Top: the client and the worker reach the cell only through its two frontends. The
    worker polls (1), gets the events so far (2), runs the code until it blocks (3) and replies with commands (4). The
    frontend hands the commands to history, the filled box, which owns the workflow&#39;s shard, turns commands into
    events, runs timers and writes to Postgres; it tells matching a task is ready, and matching hands it to the next
    poll. Bottom: HealthCheck&#39;s 24 events in order, each numbered. Filled: a workflow task completed, at 5, 11, 17
    and 22, one burst of the worker&#39;s code each. Dashed outline: the signal at 3, stored before the code read it,
    and the timers started at 18 and 23. The worker wrote none of the 24. Sources: cells/compose/cell.yml,
    docs/img/src/healthcheck-path.txt, docs/tables/readings-2026-10-23-boot1.jsonl, internal/health/health.go,
    internal/health/testdata/healthcheck_history.json.</desc>
<rect x="0" y="0" width="800" height="560" fill="#EEF3F2"/>
<text x="24" y="30" font-size="14" fill="#163A44"
    font-weight="600">The worker proposes; history writes every event</text>
<text x="24" y="50" font-size="12"
    fill="#163A44">One HealthCheck through a cell on server 1.31.0: every call through the frontend, every event by history</text>
<g aria-label="client, Dial, ExecuteWorkflow, SignalWorkflow">
  <rect x="24" y="76" width="200" height="76" fill="#CFE3E4" stroke="#163A44"/>
  <text x="124" y="95.5" font-size="12" fill="#163A44" text-anchor="middle" font-weight="600">client</text>
  <text x="124" y="110.5" font-size="12" fill="#163A44" text-anchor="middle">Dial</text>
  <text x="124" y="125.5" font-size="12" fill="#163A44" text-anchor="middle">ExecuteWorkflow</text>
  <text x="124" y="140.5" font-size="12" fill="#163A44" text-anchor="middle">SignalWorkflow</text>
</g>
<g
    aria-label="worker, 1 polls for a task, 2 gets the events so far, 3 runs code until it blocks, 4 replies with commands">
  <rect x="24" y="184" width="200" height="104" fill="#CFE3E4" stroke="#163A44"/>
  <text x="124" y="210" font-size="12" fill="#163A44" text-anchor="middle" font-weight="600">worker</text>
  <text x="124" y="225" font-size="12" fill="#163A44" text-anchor="middle">1 polls for a task</text>
  <text x="124" y="240" font-size="12" fill="#163A44" text-anchor="middle">2 gets the events so far</text>
  <text x="124" y="255" font-size="12" fill="#163A44" text-anchor="middle">3 runs code until it blocks</text>
  <text x="124" y="270" font-size="12" fill="#163A44" text-anchor="middle">4 replies with commands</text>
</g>
<g aria-label="frontend ×2, behind nginx;, every client, and worker call, comes in here">
  <rect x="268" y="76" width="140" height="212" fill="#CFE3E4" stroke="#163A44"/>
  <text x="338" y="156" font-size="12" fill="#163A44" text-anchor="middle" font-weight="600">frontend ×2</text>
  <text x="338" y="171" font-size="12" fill="#163A44" text-anchor="middle">behind nginx;</text>
  <text x="338" y="186" font-size="12" fill="#163A44" text-anchor="middle">every client</text>
  <text x="338" y="201" font-size="12" fill="#163A44" text-anchor="middle">and worker call</text>
  <text x="338" y="216" font-size="12" fill="#163A44" text-anchor="middle">comes in here</text>
</g>
<g aria-label="history, owns the workflow&#39;s shard; turns, commands into events; runs timers">
  <rect x="476" y="76" width="300" height="76" fill="#163A44" stroke="#163A44"/>
  <text x="626" y="103" font-size="12" fill="#EEF3F2" text-anchor="middle" font-weight="600">history</text>
  <text x="626" y="118" font-size="12" fill="#EEF3F2" text-anchor="middle">owns the workflow&#39;s shard; turns</text>
  <text x="626" y="133" font-size="12" fill="#EEF3F2" text-anchor="middle">commands into events; runs timers</text>
</g>
<g aria-label="matching, holds the task queue,, hands tasks to polls">
