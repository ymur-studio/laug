<polygon points="626,212 622,204 630,204" fill="#163A44"/>
<text x="632" y="190" font-size="11" fill="#163A44">task ready</text>
<polyline points="776,140 788,140 788,336" fill="none" stroke="#163A44" stroke-width="1.5"/>
<line x1="788" y1="336" x2="784" y2="336" fill="none" stroke="#163A44" stroke-width="1.5"/>
