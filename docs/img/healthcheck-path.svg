<text x="24" y="470" font-size="11"
    fill="#163A44">Filled: a workflow task completed, at 5, 11, 17 and 22. Each ends one burst of the worker&#39;s code: 4 bursts.</text>
<text x="24" y="486" font-size="11"
    fill="#163A44">Dashed outline: the signal at 3, stored before any code ran and read later; the timers started at 18 and 23.</text>
<text x="24" y="502" font-size="11"
