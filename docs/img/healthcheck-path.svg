  <text x="626" y="239" font-size="12" fill="#163A44" text-anchor="middle" font-weight="600">matching</text>
  <text x="626" y="254" font-size="12" fill="#163A44" text-anchor="middle">holds the task queue,</text>
  <text x="626" y="269" font-size="12" fill="#163A44" text-anchor="middle">hands tasks to polls</text>
</g>
<g aria-label="Postgres, persistence and visibility">
