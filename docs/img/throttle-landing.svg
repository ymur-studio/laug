<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img"
    aria-labelledby="throttle-landing-title throttle-landing-desc" font-family="Inter, system-ui, sans-serif">
<title id="throttle-landing-title">throttle-frontend: landed 35 to 36 s after the edit, back 50 to 55 s after the
    restore</title>
<desc id="throttle-landing-desc">A lane a raun of faults/catalog.yaml&#39;s throttle-frontend on a compose cell, which
    sets frontend.rps 10 in the leased cell&#39;s copy of its dynamic config, then restores the copy; across, seconds
    from the edit, the raun&#39;s inject_at. The first tick is the signal landing, ResourceExhausted errors a second
    over 30 s past 0.5; the first dashed line is the restore, remove_at; the second tick the signal back under it; the
    second dashed line the raun&#39;s budget, 180 s after the restore. Each bar is a window holding the workflows it
    completed in its seconds, left to right: during, from the landing to the hold&#39;s end; drain, from the restore to
    the after window; after. The before windows completed 1200 to 1201 in 60 s; failed client starts over every window:
    0. Sources: docs/tables/fig-throttle-landing.jsonl, docs/tables/rauns.jsonl, docs/tables/src/hosts.tsv,
    faults/catalog.yaml.</desc>
