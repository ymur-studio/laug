    font-weight="600">throttle-frontend: landed 35 to 36 s after the edit, back 50 to 55 s after the restore</text>
<text x="24" y="50" font-size="12"
    fill="#163A44">3 rauns at 20 workflows/s on server 1.31.0, the lab host, an m8i.8xlarge; frontend.rps 10, held 120 s</text>
<text x="24" y="76" font-size="11" fill="#163A44">In each bar: workflows completed</text>
