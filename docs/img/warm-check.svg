<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img"
    aria-labelledby="warm-check-title warm-check-desc" font-family="Inter, system-ui, sans-serif">
<title id="warm-check-title">A cell answers seconds before it can run a workflow</title>
<desc id="warm-check-desc">Two lanes of laug&#39;s warm-check rungs on one scale of seconds, 0 to 30. Top, three fresh
    cells, from the start of bin/laug cell up: history owned its 512 shards at 10.3 to 10.4 s; the frontend answered
    cluster health and the namespace existed at 13.8 to 14.4 s; the first HealthCheck failed, Namespace default is not
    found, and the next completed at 16 to 17 s. Each bar runs from zero to the moment its rung became true. Bottom, a
    cell whose history refused every shard, from history&#39;s start: the frontend answered SERVING at 5.3 to 6.3 s,
    while no shard was ever owned, the dashed box: 1,299 failed acquires by the last poll, after its 150 s cap. Sources:
    cells/backend-compose.sh, cells/results/2026-10-23-boot1.txt, cells/shards-ready.sh, docs/img/src/warm-check.txt,
    docs/tables/quotes.jsonl, docs/tables/readings-2026-10-23-boot1.jsonl.</desc>
<rect x="0" y="0" width="800" height="520" fill="#EEF3F2"/>
<text x="24" y="30" font-size="14" fill="#163A44"
    font-weight="600">A cell answers seconds before it can run a workflow</text>
<text x="24" y="50" font-size="12"
    fill="#163A44">laug&#39;s warm check on server 1.31.0: three fresh cells, and one cell whose history refuses every shard</text>
<text x="24" y="84" font-size="12" fill="#163A44"
    font-weight="600">Three fresh cells: seconds after bin/laug cell up began; a bar ends when its rung became true</text>
<text x="24" y="108" font-size="12" fill="#163A44" font-weight="600">shards owned</text>
<text x="24" y="122" font-size="11" fill="#163A44">history&#39;s 512, by its log line</text>
<g aria-label="10.3 to 10.4 s">
  <rect x="286" y="98" width="166.4" height="28" fill="#163A44" stroke="#163A44"/>
  <text x="369.2" y="116" font-size="12" fill="#EEF3F2" text-anchor="middle">10.3 to 10.4 s</text>
</g>
<text x="24" y="152" font-size="12" fill="#163A44" font-weight="600">frontend answers</text>
<text x="24" y="166" font-size="11" fill="#163A44">cluster health; namespace exists</text>
<g aria-label="13.8 to 14.4 s">
  <rect x="286" y="142" width="230.4" height="28" fill="#163A44" stroke="#163A44"/>
  <text x="401.2" y="160" font-size="12" fill="#EEF3F2" text-anchor="middle">13.8 to 14.4 s</text>
</g>
<text x="24" y="196" font-size="12" fill="#163A44" font-weight="600">a workflow completes</text>
<text x="24" y="210" font-size="11" fill="#163A44">one HealthCheck, end to end</text>
<g aria-label="16 to 17 s">
  <rect x="286" y="186" width="272" height="28" fill="#163A44" stroke="#163A44"/>
  <text x="422" y="204" font-size="12" fill="#EEF3F2" text-anchor="middle">16 to 17 s</text>
</g>
<line x1="286" y1="226" x2="766" y2="226" fill="none" stroke="#163A44" stroke-width="1.5"/>
<line x1="286" y1="226" x2="286" y2="230" fill="none" stroke="#163A44" stroke-width="1.5"/>
<text x="283" y="242" font-size="10" fill="#163A44">0</text>
<line x1="366" y1="226" x2="366" y2="230" fill="none" stroke="#163A44" stroke-width="1.5"/>
<text x="363" y="242" font-size="10" fill="#163A44">5</text>
<line x1="446" y1="226" x2="446" y2="230" fill="none" stroke="#163A44" stroke-width="1.5"/>
<text x="440" y="242" font-size="10" fill="#163A44">10</text>
<line x1="526" y1="226" x2="526" y2="230" fill="none" stroke="#163A44" stroke-width="1.5"/>
<text x="520" y="242" font-size="10" fill="#163A44">15</text>
<line x1="606" y1="226" x2="606" y2="230" fill="none" stroke="#163A44" stroke-width="1.5"/>
<text x="600" y="242" font-size="10" fill="#163A44">20</text>
<line x1="686" y1="226" x2="686" y2="230" fill="none" stroke="#163A44" stroke-width="1.5"/>
<text x="680" y="242" font-size="10" fill="#163A44">25</text>
<line x1="766" y1="226" x2="766" y2="230" fill="none" stroke="#163A44" stroke-width="1.5"/>
<text x="760" y="242" font-size="10" fill="#163A44">30</text>
<text x="24" y="262" font-size="11"
    fill="#163A44">The first HealthCheck on each cell failed, Namespace default is not found; the next one completed.</text>
<text x="24" y="304" font-size="12" fill="#163A44"
    font-weight="600">History refusing every shard: seconds after history started</text>
<text x="24" y="328" font-size="12" fill="#163A44" font-weight="600">frontend answers</text>
<text x="24" y="342" font-size="11" fill="#163A44">cluster health: SERVING</text>
<g aria-label="5.3 to 6.3 s">
  <rect x="286" y="318" width="100.8" height="28" fill="#163A44" stroke="#163A44"/>
  <text x="336.4" y="336" font-size="12" fill="#EEF3F2" text-anchor="middle">5.3 to 6.3 s</text>
</g>
<text x="24" y="372" font-size="12" fill="#163A44" font-weight="600">shards owned</text>
<text x="24" y="386" font-size="11" fill="#163A44">history&#39;s 512</text>
<g aria-label="none: 1,299 failed acquires by the last poll, after its 150 s cap">
  <rect x="286" y="362" width="480" height="28" fill="#EEF3F2" stroke="#C44B32" stroke-dasharray="4 3"/>
  <text x="526" y="380" font-size="12" fill="#163A44"
      text-anchor="middle">none: 1,299 failed acquires by the last poll, after its 150 s cap</text>
</g>
<line x1="286" y1="402" x2="766" y2="402" fill="none" stroke="#163A44" stroke-width="1.5"/>
<line x1="286" y1="402" x2="286" y2="406" fill="none" stroke="#163A44" stroke-width="1.5"/>
<text x="283" y="418" font-size="10" fill="#163A44">0</text>
<line x1="366" y1="402" x2="366" y2="406" fill="none" stroke="#163A44" stroke-width="1.5"/>
<text x="363" y="418" font-size="10" fill="#163A44">5</text>
<line x1="446" y1="402" x2="446" y2="406" fill="none" stroke="#163A44" stroke-width="1.5"/>
<text x="440" y="418" font-size="10" fill="#163A44">10</text>
<line x1="526" y1="402" x2="526" y2="406" fill="none" stroke="#163A44" stroke-width="1.5"/>
<text x="520" y="418" font-size="10" fill="#163A44">15</text>
<line x1="606" y1="402" x2="606" y2="406" fill="none" stroke="#163A44" stroke-width="1.5"/>
<text x="600" y="418" font-size="10" fill="#163A44">20</text>
<line x1="686" y1="402" x2="686" y2="406" fill="none" stroke="#163A44" stroke-width="1.5"/>
<text x="680" y="418" font-size="10" fill="#163A44">25</text>
<line x1="766" y1="402" x2="766" y2="406" fill="none" stroke="#163A44" stroke-width="1.5"/>
<text x="760" y="418" font-size="10" fill="#163A44">30</text>
<text x="24" y="452" font-size="11"
    fill="#163A44">Each rung proves one thing. The frontend said SERVING while history owned no shard;</text>
<text x="24" y="467" font-size="11" fill="#163A44">only a completed workflow proves the whole path works.</text>
<text x="24" y="492" font-size="10"
    fill="#163A44">History&#39;s own health status waits for its first shards; the frontend&#39;s does not (source: server v1.31.0</text>
<text x="24" y="505" font-size="10" fill="#163A44">service/history/service.go:79-90).</text>
</svg>
