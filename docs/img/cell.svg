<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540" role="img"
    aria-labelledby="cell-title cell-desc" font-family="Inter, system-ui, sans-serif">
<title id="cell-title">A cell: one Temporal deployment with its own Postgres, as compose or as a microVM</title>
<desc id="cell-desc">One cell, one compose project on one network of its own. nginx is the one gRPC address a client or
    the pool sees, 7233, in front of two frontends; Temporal UI dials it too. The server roles, frontend, frontend2,
    history, matching and worker, run one temporalio/server release, and every role reaches Postgres through toxiproxy,
    a passthrough until a fault adds a toxic. Postgres keeps its own volume and publishes no port. Prometheus scrapes
    every role, and Grafana reads Prometheus. Below, the two backends. The compose backend runs the project on the host,
    its ports on 127.0.0.1, and block b adds 10b to each. The Firecracker backend runs the same cell.yml inside a
    microVM restored from one snapshot, each cell at 10.254.&lt;b&gt;.2 on block 0&#39;s ports. Not drawn:
    temporal-setup, which writes the schema straight to Postgres, temporal-create-namespace, and Elasticsearch, a
    profile. Sources: cells/backend-compose.sh, cells/backend-firecracker.sh, cells/compose/cell.yml,
    cells/compose/prometheus.yml, cells/rootfs/snapshot.sh, docs/img/src/cell.txt.</desc>
