<svg xmlns="http://www.w3.org/2000/svg" width="800" height="616" viewBox="0 0 800 616" role="img"
    aria-labelledby="toxic-fuse-title toxic-fuse-desc" font-family="Inter, system-ui, sans-serif">
<title id="toxic-fuse-title">A reset_peer toxic on Postgres: three layers between the fault and the server</title>
<desc id="toxic-fuse-desc">Top: the cell&#39;s server roles reach its Postgres through Toxiproxy, where
    persistence-errors adds a reset_peer toxic at toxicity 0.05. Middle: what each of the three layers does: Toxiproxy
    decides once a connection whether the toxic applies; Go&#39;s database/sql retries, outside a transaction, a query
    whose open connection was closed; and Temporal&#39;s SQL layer answers a reset during a new connection&#39;s
    handshake by closing the role&#39;s whole pool, and opens a new one at most once a second (db_handle.go:24). The
    loop is the fuse the design suggests: every new connection draws the toxic again. It never blew here: no role
    stopped at any toxicity. Read in source, not run (Toxiproxy 2.12.0; database/sql with lib/pq v1.10.9; server v1.31.0
    db_handle.go:157-169). Below, what was run: boot 2&#39;s rauns of the row on compose cells, the committed toxicity
    three times, then catalog copies that change only the toxicity, a column a raun, headed by its toxicity and the end
    of its run id. A column holds the raun&#39;s verdict, when its signal crossed 0.5, and what a sampler beside it read
    on the cell&#39;s Prometheus and Postgres from the inject to the hold&#39;s end, each the range over those reads:
    persistence errors a second and workflows completed a second, each over 30 s; each role&#39;s pool refresh attempts
    and their failures, each over 1 m, at their peak, with the role that reached it; and connections to the temporal
    database. Last, the raun&#39;s failed client starts over every window. A BLOCK here means only that the fault never
    landed: its signal stayed at 0 for the whole hold. Sources: cells/compose/cell.yml, docs/img/src/toxic-fuse.txt,
    docs/tables/fig-toxic-fuse.jsonl, docs/tables/rauns.jsonl, docs/tables/src/hosts.tsv, faults/catalog.yaml.</desc>
