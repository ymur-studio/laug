<svg xmlns="http://www.w3.org/2000/svg" width="800" height="396" viewBox="0 0 800 396" role="img"
    aria-labelledby="staleness-title staleness-desc" font-family="Inter, system-ui, sans-serif">
<title id="staleness-title">The store read the gauge gone 2.5 s after the cell; without staleness tracking, 294.7
    s</title>
<desc id="staleness-desc">Two lanes, each a fake cell test of make obs-test in boot 4: a canned exposition serves
    numshards_gauge 512 to a Prometheus standing in for the cell&#39;s, which laug&#39;s store federates; then
    numshards_gauge leaves the exposition, the solid line. Across, seconds from that moment. Each row is
    kill-history&#39;s signal, faults/catalog.yaml&#39;s (512 - sum(numshards_gauge{job=&quot;temporal-history&quot;}))
    or vector(512), read on the cell&#39;s Prometheus and in the store, its segments named by their reading: 0 missing
    while the gauge serves 512; 512 missing once no sample of it is left. The top lane is TestFakeCellInTheStore, the
    store&#39;s config the stack&#39;s, track_timestamps_staleness: true (_obs/prometheus.yml); the gauge came back at
    the dashed line. The bottom lane is TestFakeCellStalenessControl, the same config with track_timestamps_staleness:
    false (_obs/follow/fakecell_test.go): the store kept the gauge&#39;s last sample and read 0, drawn faint from the
    cell&#39;s 512 on, until the diamond, its first read of 512. Each time is the tests&#39; own, to 0.1 s. Sources:
    _obs/follow/fakecell_test.go, _obs/prometheus.yml, docs/tables/fig-staleness.jsonl, docs/tables/gates.jsonl,
    faults/catalog.yaml.</desc>
