<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img"
    aria-labelledby="obs-stack-title obs-stack-desc" font-family="Inter, system-ui, sans-serif">
<title id="obs-stack-title">The stack: one store outside every cell, each cell&#39;s series named from outside</title>
<desc id="obs-stack-desc">Left: each leased cell&#39;s own Prometheus, which dies with its cell, and bin/obs follow,
    which writes a target file a cell with the labels that outlive it. Middle: the stack&#39;s store federates each cell
    every 5 s and keeps the cell&#39;s own timestamps; with track_timestamps_staleness true a series the cell stops
    serving goes stale at the next pass, not 5 minutes on. It scrapes cellstat, follow, the host and the
    orchestrator&#39;s dev server too. Bottom: workflow Gate&#39;s worker and starter send traces over OTLP to the
    Collector, which hands them to Jaeger. Right: Grafana reads both. Every address is 127.0.0.1 (_obs/prometheus.yml,
    _obs/collector.yaml, _obs/jaeger.yaml). Sources: _obs/collector.yaml, _obs/grafana/grafana.ini,
    _obs/grafana/provisioning/datasources/stack.yml, _obs/jaeger.yaml, _obs/prometheus.yml, _obs/versions.txt,
    cells/compose/cell.yml, docs/img/src/obs-stack.txt.</desc>
<rect x="0" y="0" width="800" height="520" fill="#EEF3F2"/>
<text x="24" y="30" font-size="14" fill="#163A44"
    font-weight="600">The stack: one store outside every cell, each cell&#39;s series named from outside</text>
<text x="24" y="50" font-size="12"
    fill="#163A44">bin/obs up: Prometheus, the Collector, Jaeger and Grafana, every listener on 127.0.0.1</text>
