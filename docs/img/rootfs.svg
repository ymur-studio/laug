<svg xmlns="http://www.w3.org/2000/svg" width="800" height="632" viewBox="0 0 800 632" role="img"
    aria-labelledby="rootfs-title rootfs-desc" font-family="Inter, system-ui, sans-serif">
<title id="rootfs-title">A microVM cell: one snapshot, then a clone for each cell, its disk a reflink</title>
<desc id="rootfs-desc">Left, make fc-snapshot, once. It copies the image&#39;s disk to golden.ext4 and boots a microVM
    from it, with the cell brought to warm inside. It freezes the cell&#39;s containers with docker pause unless
    FREEZE=0, pauses the microVM and writes a full snapshot, vm.snap and vm.mem. Right, the pool&#39;s create, for each
    cell. It reflinks golden.ext4 into a disk of its own that shares its blocks, and makes network and mount namespaces,
    under the jailer by default. A veth pair to the host, tap0 and a DNAT let every clone keep one guest address. The
    cell&#39;s disk is bound at the path the snapshot recorded, in its mount namespace only. Then snapshot/load, and
    resume once the VM holds the cell&#39;s disk, not golden.ext4. The host sets the guest clock over one ssh session,
    and the containers thaw only after the set. Then the pool&#39;s health check passes, and the cell is warm. A
    snapshot taken with FREEZE=0 is not frozen, and no thaw runs. make fc-restore runs the same restore on one microVM
    on the host&#39;s own network, with no pool, and times it to warm. Sources: cells/backend-firecracker.sh,
    cells/rootfs/fc-lib.sh, cells/rootfs/restore.sh, cells/rootfs/snapshot.sh, docs/img/src/rootfs.txt,
    internal/pool/pool.go.</desc>
