<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540" role="img"
    aria-labelledby="startup-race-title startup-race-desc" font-family="Inter, system-ui, sans-serif">
<title id="startup-race-title">Started together, two frontends race to rewrite one record</title>
<desc id="startup-race-desc">Top left, before: frontends A and B, on ports 7237 and 7236, both rewrite the one cluster
    metadata row, which a version guards; the loser gets version mismatch, Unavailable, retries once 40 to 50 ms later,
    loses again and exits, and Docker restarts it, the outlined box. Top right, after: each role starts only once the
    one before it listens, and a role listens only after its write, so the next one reads a settled record. Bottom,
    seconds from the start of create until each new cell passed laug&#39;s warm check, on one scale from 0 to 140:
    before, 6 cells at 14.4 to 14.8 s and 4 at 54.0 to 130.1 s; after, all 20 at 15.5 to 17.2 s, with no restarts.
    Ranges are drawn as a line between end ticks. Sources: cells/compose/cell.yml, docs/img/src/startup-race.txt,
    docs/tables/quotes.jsonl.</desc>
<rect x="0" y="0" width="800" height="540" fill="#EEF3F2"/>
<text x="24" y="30" font-size="14" fill="#163A44"
    font-weight="600">Started together, two frontends race to rewrite one record</text>
<text x="24" y="50" font-size="12"
    fill="#163A44">Server 1.31.0, cells made one at a time: 10 with their roles started together, then 20 in turn</text>
<rect x="16" y="70" width="376" height="262" fill="none" stroke="#163A44" stroke-dasharray="6 4"/>
<text x="24" y="86" font-size="11" fill="#163A44" font-weight="600">before: started together</text>
<g aria-label="frontend A, writes :7237">
  <rect x="36" y="96" width="160" height="44" fill="#CFE3E4" stroke="#163A44"/>
  <text x="116" y="114.5" font-size="12" fill="#163A44" text-anchor="middle" font-weight="600">frontend A</text>
  <text x="116" y="129.5" font-size="12" fill="#163A44" text-anchor="middle">writes :7237</text>
</g>
<g aria-label="frontend B, writes :7236">
  <rect x="212" y="96" width="160" height="44" fill="#CFE3E4" stroke="#163A44"/>
  <text x="292" y="114.5" font-size="12" fill="#163A44" text-anchor="middle" font-weight="600">frontend B</text>
  <text x="292" y="129.5" font-size="12" fill="#163A44" text-anchor="middle">writes :7236</text>
</g>
<g aria-label="cluster metadata, one row, guarded by a version">
  <rect x="36" y="166" width="336" height="44" fill="#CFE3E4" stroke="#163A44"/>
  <text x="204" y="184.5" font-size="12" fill="#163A44" text-anchor="middle" font-weight="600">cluster metadata</text>
  <text x="204" y="199.5" font-size="12" fill="#163A44" text-anchor="middle">one row, guarded by a version</text>
</g>
<g
    aria-label="the loser exits, version mismatch, Unavailable;, retried once 40 to 50 ms later, loses again, and exits; Docker restarts it">
  <rect x="36" y="236" width="336" height="80" fill="#EEF3F2" stroke="#C44B32"/>
  <text x="204" y="257.5" font-size="12" fill="#163A44" text-anchor="middle" font-weight="600">the loser exits</text>
  <text x="204" y="272.5" font-size="12" fill="#163A44" text-anchor="middle">version mismatch, Unavailable;</text>
  <text x="204" y="287.5" font-size="12" fill="#163A44"
      text-anchor="middle">retried once 40 to 50 ms later, loses again</text>
  <text x="204" y="302.5" font-size="12" fill="#163A44" text-anchor="middle">and exits; Docker restarts it</text>
</g>
<line x1="116" y1="140" x2="116" y2="158" fill="none" stroke="#163A44" stroke-width="1.5"/>
<polygon points="116,166 112,158 120,158" fill="#163A44"/>
<line x1="292" y1="140" x2="292" y2="158" fill="none" stroke="#163A44" stroke-width="1.5"/>
<polygon points="292,166 288,158 296,158" fill="#163A44"/>
<line x1="204" y1="210" x2="204" y2="228" fill="none" stroke="#163A44" stroke-width="1.5"/>
<polygon points="204,236 200,228 208,228" fill="#163A44"/>
<rect x="408" y="70" width="376" height="262" fill="none" stroke="#163A44" stroke-dasharray="6 4"/>
<text x="416" y="86" font-size="11" fill="#163A44" font-weight="600">after: started in turn</text>
<g aria-label="a role starts, and rewrites the record if it differs">
  <rect x="428" y="96" width="336" height="44" fill="#CFE3E4" stroke="#163A44"/>
  <text x="596" y="114.5" font-size="12" fill="#163A44" text-anchor="middle" font-weight="600">a role starts</text>
  <text x="596" y="129.5" font-size="12" fill="#163A44"
      text-anchor="middle">and rewrites the record if it differs</text>
</g>
<g aria-label="it listens only after that write, so listening means the write is done">
  <rect x="428" y="166" width="336" height="44" fill="#CFE3E4" stroke="#163A44"/>
  <text x="596" y="184.5" font-size="12" fill="#163A44" text-anchor="middle"
      font-weight="600">it listens only after that write</text>
  <text x="596" y="199.5" font-size="12" fill="#163A44" text-anchor="middle">so listening means the write is done</text>
</g>
<g aria-label="the next role starts, only once the one before listens,, and reads a settled record">
  <rect x="428" y="236" width="336" height="80" fill="#CFE3E4" stroke="#163A44"/>
  <text x="596" y="265" font-size="12" fill="#163A44" text-anchor="middle" font-weight="600">the next role starts</text>
  <text x="596" y="280" font-size="12" fill="#163A44" text-anchor="middle">only once the one before listens,</text>
  <text x="596" y="295" font-size="12" fill="#163A44" text-anchor="middle">and reads a settled record</text>
</g>
