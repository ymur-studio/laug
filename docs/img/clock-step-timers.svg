  <line x1="249.409" y1="332" x2="249.409" y2="354" fill="none" stroke="#10181C" stroke-width="1.5" stroke-dasharray="4
      3"><title>the guest&#39;s clock stepped back 120.9 s</title></line>
  <line x1="468.83" y1="332" x2="468.83" y2="354" fill="none" stroke="#10181C"
      stroke-width="1.5"><title>the guest&#39;s clock set to the host&#39;s time; the timers fired 40.427 to 40.445 s after</title></line>
</g>
