<text x="24" y="30" font-size="14" fill="#163A44"
    font-weight="600">After a 120.9 s step back, a 60 s timer fired 121.163 s late; the server saw 60.021 s</text>
<text x="24" y="50" font-size="12"
    fill="#163A44">laug health timer on a microVM cell of batch E on the lab host, an m8i.8xlarge: host seconds from each arm</text>
