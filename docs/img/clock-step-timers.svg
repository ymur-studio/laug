<line x1="467.429" y1="90" x2="467.429" y2="380" fill="none" stroke="#CFE3E4"/>
<line x1="544.571" y1="90" x2="544.571" y2="380" fill="none" stroke="#CFE3E4"/>
<line x1="621.714" y1="90" x2="621.714" y2="380" fill="none" stroke="#CFE3E4"/>
