<svg xmlns="http://www.w3.org/2000/svg" width="800" height="454" viewBox="0 0 800 454" role="img"
    aria-labelledby="clock-step-timers-title clock-step-timers-desc" font-family="Inter, system-ui, sans-serif">
<title id="clock-step-timers-title">After a 120.9 s step back, a 60 s timer fired 121.163 s late; the server saw 60.021
    s</title>
<desc id="clock-step-timers-desc">Three lanes, each laug health timer on one leased microVM cell of batch E; across,
    seconds by the host&#39;s clock from the moment each timer was armed. A bar is one durable timer in two segments:
    the first to when it was due, its length, then the second to when it fired by host time, its lateness. The dashed
    line is the guest&#39;s clock stepped back 120.9 s, the batch&#39;s own date command in the guest; the solid line
    the guest&#39;s clock set to the host&#39;s time. The top lane, T1, is the control: no step, 0.415 s late. In the
    middle, T2: the step at +5.205 s, never set right while the timer ran; it fired 121.163 s late by host time while
    the server, on the guest&#39;s clock, recorded 60.021 s. At the bottom, T3: three timers armed within 2.347 ms, a
    step of the same size at +5.215 s, the clock set right at +90.545 s; all three fired 40.427 to 40.445 s after the
    set, within 17.816 ms of each other, the server&#39;s view 130.911 s each. T3&#39;s lines are from its first arm.
    Sources: docs/tables/fig-clock-step-timers.jsonl, docs/tables/src/hosts.tsv.</desc>
