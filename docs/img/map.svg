<svg xmlns="http://www.w3.org/2000/svg" width="800" height="632" viewBox="0 0 800 632" role="img"
    aria-labelledby="map-title map-desc" font-family="Inter, system-ui, sans-serif">
<title id="map-title">laug&#39;s map: cells from a warm pool, a load and a fault on them, a judge and its
    verdict</title>
<desc id="map-desc">Above, one lease. A requester, a person with laug lease or laug raun, asks laug pool serve for a
    cell. The pool builds cells warm before anyone asks and hands one over. The leased cell is a Temporal server of its
    own: every role, and its own Postgres behind toxiproxy. laug load runs Omes on it. laug fault holds a fault on it
    and reads it before, during and after. Released, the cell is destroyed, and the pool builds warm cells back up to
    its -min. Below, one gate. laug gate run starts a pool of its own, which builds a fresh cell for each of its three
    leases. Three items run at once: incumbent, the release the tag replaces, under the load; steady, the release under
    the same load; pl, the release with Postgres slowed by a fault. Each writes its files under gate/results/&lt;gate
    id&gt;/. The judge, laug judge, reads them: ADVANCE only when every rule from R1 to R7 holds, else BLOCK, naming the
    rule that decided. Sources: cells/compose/cell.yml, cmd/laug/main.go, cmd/laug/pool.go, docs/DESIGN.md,
    docs/img/src/map.txt, faults/README.md, faults/catalog.yaml, gate/plan.yaml, gate/run.sh,
    internal/pool/pool.go.</desc>
